{% extends "base_admin.html" %}{% block title %}訂餐設定｜艾瑞塔{% endblock %}{% block content %}
<div class="page-head"><div><span class="eyebrow">SETTINGS</span><h1>地點與訂餐設定</h1></div></div><div class="admin-grid"><section class="panel"><h2>本次訂餐</h2><form method="post" action="/admin/settings" class="admin-form"><label>首頁標題<input name="headline" value="{{ settings.headline }}" required></label><label>取餐日期<input type="date" name="order_date" value="{{ settings.order_date }}" required></label><label class="check"><input type="checkbox" name="ordering_open" {% if settings.ordering_open %}checked{% endif %}> 開放客人下單</label><button class="primary">儲存設定</button></form></section><section class="panel"><h2>新增取餐地點</h2><form method="post" action="/admin/locations/save" class="admin-form"><label>地點名稱<input name="name" required></label><div class="two"><label>取餐時間<input name="pickup_time" placeholder="11:30–13:00" required></label><label>排序<input type="number" name="sort" value="99"></label></div><label class="check"><input type="checkbox" name="active" checked> 啟用</label><button class="primary">新增地點</button></form></section></div><section class="panel wide"><h2>目前取餐地點</h2><div class="manage-list">{% for loc in locations %}<div class="manage-row no-image"><div><b>{{ loc.name }}</b><span>{{ loc.pickup_time }}</span></div><span class="visibility">{{ '啟用' if loc.active else '停用' }}</span><form method="post" action="/admin/locations/{{ loc.id }}/toggle"><button>{{ '停用' if loc.active else '啟用' }}</button></form></div>{% endfor %}</div></section>
{% endblock %}
