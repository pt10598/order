{% extends "base_admin.html" %}{% block title %}訂餐設定｜艾瑞塔{% endblock %}{% block content %}
<div class="page-head"><div><span class="eyebrow">SETTINGS</span><h1>地點與訂餐設定</h1></div></div><div class="admin-grid"><section class="panel"><h2>本次訂餐</h2><form method="post" action="/admin/settings" class="admin-form"><label>首頁標題<input name="headline" value="{{ settings.headline }}" required></label><label>取餐日期<input type="date" name="order_date" value="{{ settings.order_date }}" required></label><label class="check"><input type="checkbox" name="ordering_open" {% if settings.ordering_open %}checked{% endif %}> 開放客人下單</label><button class="primary">儲存設定</button></form></section><section class="panel"><h2>新增取餐地點</h2><form method="post" action="/admin/locations/save" class="admin-form"><label>地點名稱<input name="name" required></label><label>可選取餐時間<input name="pickup_slots" placeholder="11:30, 12:00, 12:30" required><small>請用逗號分隔每個時間點。</small></label><label>排序<input type="number" name="sort" value="99"></label><label class="check"><input type="checkbox" name="active" checked> 啟用</label><button class="primary">新增地點</button></form></section></div><section class="panel wide"><h2>目前取餐地點</h2><div class="location-edit-list">{% for loc in locations %}<form method="post" action="/admin/locations/save" class="location-edit-row"><input type="hidden" name="location_id" value="{{ loc.id }}"><label>地點<input name="name" value="{{ loc.name }}" required></label><label>可選時間點<input name="pickup_slots" value="{{ loc.pickup_slots|default(['11:30','12:00','12:30'],true)|join(', ') }}" required></label><label>排序<input type="number" name="sort" value="{{ loc.sort }}"></label><label class="inline-check"><input type="checkbox" name="active" {% if loc.active %}checked{% endif %}> 啟用</label><button>儲存修改</button></form>{% endfor %}</div></section>
{% endblock %}
